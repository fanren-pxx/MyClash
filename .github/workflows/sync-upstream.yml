name: Sync from upstream

# 自动跟踪 AIsouler/MyClash 上游更新，并把 DNS 防泄露改动保留在上面
#
# 触发方式：
#   1. 每天 04:17 (UTC+8) 自动检查一次
#   2. 仓库 Actions 页面点 "Run workflow" 手动触发
#
# 行为：
#   - 快进合并（fast-forward）优先，不产生多余提交
#   - 上游改了冲突文件时，自动合并失败 → 开一个 issue 提醒你手动解决
#   - 合并成功后自动推送，raw 链接立即生效

on:
  schedule:
    # cron 是 UTC。04:17 UTC+8 == 20:17 UTC
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查不推送（dry run）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 用默认 GITHUB_TOKEN 即可，无需额外 secret
          persist-credentials: true

      - name: Show current state
        run: |
          echo "当前 HEAD: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          echo "远程分支:"
          git branch -r

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/AIsouler/MyClash.git || \
            git remote set-url upstream https://github.com/AIsouler/MyClash.git

      - name: Fetch upstream
        id: fetch
        run: |
          git fetch upstream main --depth=50
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          HEAD_SHA=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" "$HEAD_SHA"; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已是最新，无需同步"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "⬆️ 上游有新提交，开始合并"
            git log --oneline "$HEAD_SHA".."$UPSTREAM_SHA"
          fi

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.up_to_date == 'false'
        run: |
          set +e
          # 先尝试 fast-forward（你没有任何本地提交时走这条路，最干净）
          git merge --ff-only upstream/main
          FF_EXIT=$?
          if [ "$FF_EXIT" -ne 0 ]; then
            echo "无法快进，改用普通合并（保留本地 DNS 修复提交）"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit upstream/main
            MERGE_EXIT=$?
            if [ "$MERGE_EXIT" -ne 0 ]; then
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              git diff --name-only --diff-filter=U || true
              exit 0
            fi
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify DNS fix is still intact
        id: verify
        if: steps.merge.outputs.conflict == 'false' && steps.fetch.outputs.up_to_date == 'false'
        run: |
          # 上游可能改了 DNS 常量，这里做一次硬校验，防止修复被静默覆盖。
          # 分两层：静态检查（常量和函数还在）+ 行为验证（真正跑一次 main() 看输出）
          FAIL=0
          SRC=Script/mihomoScript.js

          # 1. bootstrap 常量不能再出现明文 114
          if grep -E "^const (defaultDNS|proxyServerDNS) *=" "$SRC" | grep -q "114.114"; then
            echo "❌ defaultDNS / proxyServerDNS 里又出现了明文 114"
            FAIL=1
          fi

          # 2. DoT bootstrap 还在
          grep -q "dns.alidns.com" "$SRC" || { echo "❌ 找不到 DoT bootstrap"; FAIL=1; }

          # 3. isPlainDns 必须是"函数定义"，只命中调用处不算（防止函数被删、调用残留）
          grep -q "function isPlainDns" "$SRC" || { echo "❌ isPlainDns 函数定义丢失"; FAIL=1; }

          # 4. 行为验证：喂一个明文 DNS 给节点域名策略，输出里必须被换成加密 DoT。
          #    这是唯一能证明"防护逻辑真的生效"的检查，静态 grep 做不到。
          if [ "$FAIL" -eq 0 ]; then
            node -e '
              const { loadScript } = require("./Test/lib/loader");
              const api = loadScript("Script/mihomoScript.js");
              const cfg = {
                proxies: [{ name: "HK 01", type: "ss", server: "n1.verify.test", port: 443, cipher: "aes-128-gcm", password: "x" }],
                dns: { "proxy-server-nameserver-policy": { "n1.verify.test": ["114.114.114.114#DIRECT", "system"] } },
              };
              const out = api.main(cfg).dns["proxy-server-nameserver-policy"]["n1.verify.test"];
              const ok = Array.isArray(out) && out.length > 0 && out.every((d) => /^(tls|https|h3|quic):\/\//.test(d));
              if (!ok) {
                console.error("❌ 行为验证失败：明文 DNS 没有被剔除/兜底，实际输出 =", JSON.stringify(out));
                process.exit(1);
              }
              console.log("✅ 行为验证通过：明文 DNS 已替换为", out[0]);
            ' || { echo "❌ 行为验证未通过"; FAIL=1; }
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "dns_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "dns_ok=true" >> "$GITHUB_OUTPUT"
          echo "✅ DNS 防泄露改动完好（静态 + 行为验证均通过）"

      - name: Run tests
        id: test
        # 校验失败就不用跑测试了，直接让 job 失败
        if: |
          steps.merge.outputs.conflict == 'false' &&
          steps.fetch.outputs.up_to_date == 'false' &&
          steps.verify.outputs.dns_ok == 'true'
        run: |
          npm --prefix Test install --no-audit --no-fund
          node Test/run-tests.js
          echo "test_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Push
        # 只有「无冲突 + DNS 校验通过 + 测试通过」才推送，任何一项失败都不落地
        if: |
          steps.merge.outputs.conflict == 'false' &&
          steps.fetch.outputs.up_to_date == 'false' &&
          steps.verify.outputs.dns_ok == 'true' &&
          steps.test.outputs.test_exit == '0' &&
          inputs.dry_run != 'true'
        run: |
          git push origin HEAD:main
          echo "✅ 已推送到 main"

      - name: Open issue on verification failure
        # 合并成功但 DNS 校验或测试没通过：不推送，开 issue 提醒。
        # 注意 Push 的 if 是"必须都成功"，这里用 always() + 反向条件，保证失败时也会执行
        if: |
          always() &&
          steps.merge.outputs.conflict == 'false' &&
          steps.fetch.outputs.up_to_date == 'false' &&
          (steps.verify.outputs.dns_ok != 'true' || steps.test.outputs.test_exit != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 上游合并后校验未通过，已阻止推送"
          BODY=$(printf '%s\n' \
            "上游有新提交，自动合并成功，但**合并结果没通过校验，因此没有推送到 main**。" \
            "" \
            "| 校验项 | 结果 |" \
            "|---|---|" \
            "| DNS 防泄露完好 | \`${{ steps.verify.outputs.dns_ok }}\` |" \
            "| 测试退出码 | \`${{ steps.test.outputs.test_exit }}\` |" \
            "" \
            "**常见原因**：上游改动了 \`Script/mihomoScript.js\` 的 \`defaultDNS\` / \`proxyServerDNS\`，把加密 DNS 换回了明文（如 114）。" \
            "" \
            "**处理步骤：**" \
            "" \
            '```bash' \
            "git pull" \
            "git remote add upstream https://github.com/AIsouler/MyClash.git  # 如已有可跳过" \
            "git fetch upstream" \
            "git merge upstream/main" \
            "# 手动修正：defaultDNS / proxyServerDNS 必须保持 tls://IP#SNI 形式，不能出现 114 等明文 DNS" \
            "node Test/run-tests.js   # 211 项全绿再推" \
            "git push" \
            '```' \
            "" \
            "上游提交：${{ steps.fetch.outputs.upstream }}" \
            "" \
            "---" \
            "_此 issue 由 sync-upstream workflow 自动创建_")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true
          exit 1

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 上游更新合并冲突，需要手动处理"
          # 已存在同类 issue 就不重复开
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE" --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "已有 issue #$EXISTING，追加评论"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "自动同步于 $(date -u) 再次冲突，上游 HEAD: ${{ steps.fetch.outputs.upstream }}"
          else
            BODY=$(printf '%s\n' \
              "上游 \`AIsouler/MyClash\` 有新提交，但自动合并失败（冲突文件见 Actions 日志）。" \
              "" \
              "**手动处理步骤：**" \
              "" \
              '```bash' \
              "git pull" \
              "git remote add upstream https://github.com/AIsouler/MyClash.git  # 如已有可跳过" \
              "git fetch upstream" \
              "git merge upstream/main" \
              "# 解决冲突（通常在 Script/mihomoScript.js 的 defaultDNS / proxyServerDNS 两个常量）" \
              "# ⚠️ 解决时保留 DNS 修复：defaultDNS 必须仍是 tls://...#SNI 形式，不能回到 114" \
              "node Test/run-tests.js   # 211 项全绿再推" \
              "git push" \
              '```' \
              "" \
              "上游提交：${{ steps.fetch.outputs.upstream }}" \
              "" \
              "---" \
              "_此 issue 由 sync-upstream workflow 自动创建，处理完可关闭_")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Summary
        run: |
          {
            echo "## 上游同步结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游 HEAD | \`${{ steps.fetch.outputs.upstream }}\` |"
            echo "| 合并前 HEAD | \`${{ steps.fetch.outputs.head }}\` |"
            echo "| 是否有更新 | \`${{ steps.fetch.outputs.up_to_date == 'true' && '无' || '有' }}\` |"
            echo "| 冲突 | \`${{ steps.merge.outputs.conflict || '无' }}\` |"
            echo "| DNS 修复完好 | \`${{ steps.verify.outputs.dns_ok || 'n/a' }}\` |"
            echo "| 测试退出码 | \`${{ steps.test.outputs.test_exit || 'n/a' }}\` |"
            echo "| dry run | \`${{ inputs.dry_run || 'false' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
